<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday — A Little Journey</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff6ec; --peach:#ffb997; --coral:#ff7d7d; --gold:#f6c453;
    --blush:#ffd7c2; --deep:#7a3b2e; --ink:#4a2b23; --leaf:#7bab6e; --stem:#5c8a52;
    --figure-a:#e8896f; --figure-b:#c96a86;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Poppins',sans-serif;
    background: radial-gradient(ellipse at 30% 0%, #fff1de 0%, #ffdcc2 40%, #ffc9a8 100%);
    min-height:100vh; overflow-x:hidden; position:relative;
  }
  .wash{ position:absolute; border-radius:50%; filter: blur(6px); opacity:0.5; pointer-events:none; animation: driftWash ease-in-out infinite; }
  @keyframes driftWash{ 0%,100%{transform:translateY(0) translateX(0) scale(1);} 50%{transform:translateY(-30px) translateX(18px) scale(1.12);} }
  .spark{ position:absolute; color:#fff3d6; pointer-events:none; animation: twinkle ease-in-out infinite; text-shadow:0 0 8px #ffe2a6; }
  @keyframes twinkle{ 0%,100%{opacity:0.15; transform:scale(0.7);} 50%{opacity:1; transform:scale(1.25);} }

  .scene{
    position:relative; min-height:100vh; width:100%;
    display:none; align-items:center; justify-content:center; flex-direction:column;
    padding: 40px 20px; text-align:center;
    opacity:0; transition: opacity 0.8s ease;
  }
  .scene.active{ display:flex; opacity:1; }
  .scene.exit{ opacity:0; }

  .prompt-text{
    font-family:'Great Vibes', cursive; font-size: 2rem; color: var(--deep);
    margin-bottom: 18px; opacity:0; animation: fadeIn 1s ease forwards 0.4s;
  }
  .sub-text{
    font-size:12px; letter-spacing:2px; text-transform:uppercase; color: var(--deep);
    opacity:0; animation: fadeIn 1s ease forwards 0.8s; margin-top:10px;
  }
  @keyframes fadeIn{ to{ opacity:0.85; } }

  /* ===================== STAGE 1: CAKE ===================== */
  #cakeStage .cake-wrap{
    width: 260px; transform: translateY(120px); opacity:0;
    animation: cakeRise 1.4s cubic-bezier(.22,1,.36,1) forwards 0.3s;
  }
  @keyframes cakeRise{ to{ transform: translateY(0); opacity:1; } }
  .cake-wrap svg{ width:100%; height:auto; overflow:visible; }
  .flame{ transform-origin: center bottom; animation: flicker 0.4s ease-in-out infinite alternate; }
  @keyframes flicker{ 0%{ transform: scaleY(1) rotate(-2deg);} 100%{ transform: scaleY(1.12) rotate(2deg);} }
  .flame.out{ animation: none; opacity:0; transition: opacity 0.4s ease; }
  .smoke{ opacity:0; pointer-events:none; }
  .smoke.show{ animation: smokeRise 1.8s ease-out forwards; }
  @keyframes smokeRise{ 0%{opacity:0.7; transform:translateY(0) scale(1);} 100%{opacity:0; transform:translateY(-40px) scale(2.2);} }

  .candle-title{
    margin-top: 28px;
    font-family:'Great Vibes', cursive;
    font-size: 2.6rem;
    background: linear-gradient(90deg, var(--coral), var(--gold), var(--peach), var(--coral));
    background-size: 300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 0 14px rgba(255,150,110,0.5));
    opacity:0;
    transform: translateY(14px) scale(0.9);
  }
  .candle-title.reveal{
    animation: candleTitleIn 1s cubic-bezier(.22,1,.36,1) forwards, shimmer 5s linear infinite 1s;
  }
  @keyframes candleTitleIn{
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  /* ===================== STAGE 2: HUGGING SISTERS ===================== */
  #hugStage .hug-stage{ width: 300px; height: 300px; max-width: 78vw; position:relative; }
  #hugStage svg{ width:100%; height:100%; overflow:visible; }
  .figure-a, .figure-b{ transform-origin: center bottom; }
  .figure-a{ animation: walkInLeft 1.4s cubic-bezier(.34,1.56,.64,1) forwards; }
  .figure-b{ animation: walkInRight 1.4s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes walkInLeft{ 0%{transform:translateX(-70px) rotate(-4deg); opacity:0;} 60%{opacity:1;} 100%{transform:translateX(0) rotate(0deg); opacity:1;} }
  @keyframes walkInRight{ 0%{transform:translateX(70px) rotate(4deg); opacity:0;} 60%{opacity:1;} 100%{transform:translateX(0) rotate(0deg); opacity:1;} }
  .hug-group{ animation: embraceSway 3s ease-in-out 1.5s infinite; }
  @keyframes embraceSway{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-3px) rotate(0.6deg);} }
  .arm-wrap{ stroke-dasharray:140; stroke-dashoffset:140; animation: drawArm 0.9s ease forwards 1.15s; }
  @keyframes drawArm{ to{ stroke-dashoffset:0; } }
  .rising-heart{ opacity:0; transform: translateY(0) scale(0.3); animation: heartRise 1.6s cubic-bezier(.22,1,.36,1) forwards 2.6s; }
  @keyframes heartRise{ 0%{opacity:0; transform:translateY(0) scale(0.2);} 35%{opacity:1;} 100%{opacity:1; transform:translateY(-92px) scale(1);} }
  .rising-heart path{ filter: drop-shadow(0 0 14px rgba(255,125,125,0.85)); }
  .rising-heart .beat{ animation: gentleBeat 1.4s ease-in-out infinite 4.2s; transform-origin:center; }
  @keyframes gentleBeat{ 0%,100%{transform:scale(1);} 30%{transform:scale(1.14);} 45%{transform:scale(1);} }

  /* ===================== STAGE 3: VIDEO ===================== */
  #videoStage .video-frame{
    width: min(520px, 88vw); border-radius: 24px; overflow:hidden;
    border: 1px solid rgba(255,255,255,0.6);
    box-shadow: 0 20px 55px rgba(122,59,46,0.25), 0 0 60px 4px rgba(255,180,120,0.3);
    opacity:0; transform: scale(0.92);
    animation: videoIn 1s cubic-bezier(.22,1,.36,1) forwards 0.2s;
    background:#00000022;
  }
  @keyframes videoIn{ to{ opacity:1; transform: scale(1); } }
  #videoStage video{ width:100%; display:block; }

  /* ===================== STAGE 4: FLOWER ===================== */
  #flowerStage .flower-wrap{ width: 220px; height: 340px; position:relative; }
  #flowerStage svg{ width:100%; height:100%; overflow:visible; }
  .stem-path{ fill:none; stroke: var(--stem); stroke-width:6; stroke-linecap:round; stroke-dasharray:220; stroke-dashoffset:220; animation: growStem 1.8s ease forwards 0.2s; }
  @keyframes growStem{ to{ stroke-dashoffset:0; } }
  .leaf{ opacity:0; transform-origin:center; animation: leafPop 0.6s ease forwards; }
  .leaf.l1{ animation-delay: 1.1s; } .leaf.l2{ animation-delay: 1.4s; }
  @keyframes leafPop{ 0%{opacity:0; transform:scale(0.3);} 100%{opacity:1; transform:scale(1);} }
  .petal-group{ opacity:0; transform-origin: 110px 70px; animation: bloomIn 1.4s cubic-bezier(.22,1,.36,1) forwards 1.9s; }
  @keyframes bloomIn{ 0%{opacity:0; transform:scale(0.15) rotate(-30deg);} 60%{opacity:1;} 100%{opacity:1; transform:scale(1) rotate(0deg);} }

  /* ===================== STAGE 5: PHOTO + WISHES OVERLAY ===================== */
  #photoStage{
    padding:0; justify-content:flex-end; align-items:stretch;
  }
  .photo-frame{
    position:absolute; inset:0; overflow:hidden;
  }
  .photo-frame img{
    width:100%; height:100%; object-fit:cover; object-position: center 20%;
    opacity:0; transform: scale(1.08);
    animation: photoIn 1.6s cubic-bezier(.22,1,.36,1) forwards 0.2s;
    filter: saturate(1.05);
  }
  @keyframes photoIn{ to{ opacity:1; transform: scale(1); } }
  .photo-gradient{
    position:absolute; inset:0;
    background: linear-gradient(to top,
      rgba(74,43,35,0.92) 0%,
      rgba(74,43,35,0.75) 22%,
      rgba(74,43,35,0.25) 46%,
      rgba(74,43,35,0.0) 62%);
  }
  .photo-content{
    position:relative; z-index:2; width:100%;
    padding: 40px 24px 56px;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    min-height:100vh;
  }
  .eyebrow{ text-align:center; letter-spacing:4px; text-transform:uppercase; font-size:11px; font-weight:600; color:#fff3e6; opacity:0.8; margin-bottom:6px; }
  .card-title{
    font-family:'Great Vibes', cursive; font-size: 3rem; text-align:center;
    background: linear-gradient(90deg, var(--coral), var(--gold), var(--peach), var(--coral));
    background-size: 300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: shimmer 5s linear infinite; margin-bottom: 6px; filter: drop-shadow(0 0 12px rgba(255,150,110,0.5));
  }
  @keyframes shimmer{ 0%{background-position:0% 50%;} 100%{background-position:300% 50%;} }
  .divider{ width:70px; height:2px; margin: 6px auto 22px; background: linear-gradient(90deg, transparent, var(--gold), transparent); position:relative; }
  .divider::before{ content:"❀"; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:14px; color: var(--gold); }
  .wish-text{
    font-family:'Great Vibes', cursive; font-size: 1.7rem; line-height:1.5; text-align:center;
    color:#fff9f4; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    min-height: 190px; max-width: 560px;
  }
  .cursor{ display:inline-block; width:2px; background:#ffe0c2; margin-left:2px; animation: blink 0.85s step-end infinite; box-shadow:0 0 8px #ffe0c2; }
  @keyframes blink{ 50%{ opacity:0; } }
  .signature-row{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:22px; opacity:0; }
  .signature-row .heart-beat{ color: var(--coral); filter: drop-shadow(0 0 8px var(--coral)); animation: heartbeat 1.3s ease-in-out infinite; font-size:20px; }
  @keyframes heartbeat{ 0%,100%{transform:scale(1);} 25%{transform:scale(1.25);} 40%{transform:scale(1);} 60%{transform:scale(1.15);} }
  .signature-row span.name{ font-family:'Great Vibes', cursive; font-size:1.5rem; color:#fff3e6; }

  #confetti-layer{ position:fixed; inset:0; pointer-events:none; z-index:9; }
  .confetto{ position:absolute; top:-20px; border-radius:2px; opacity:0.95; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(0) rotate(0deg);} 100%{transform:translateY(105vh) rotate(540deg);} }
  .firework{ position:fixed; border-radius:50%; pointer-events:none; z-index:9; animation: fwPop 1s ease-out forwards; }
  @keyframes fwPop{ 0%{opacity:1; transform:scale(0);} 100%{opacity:0; transform:scale(1);} }

  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; } }
  @media (max-width: 480px){
    .card-title{ font-size: 2.2rem; } .wish-text{ font-size: 1.4rem; min-height: 220px; }
    .hug-stage{ width:250px; height:250px; }
  }
</style>
</head>
<body>

<div id="confetti-layer"></div>

<!-- ============ STAGE 1: CAKE + CANDLE (auto) ============ -->
<section class="scene active" id="cakeStage">
  <div class="prompt-text">Make a wish...</div>
  <div class="cake-wrap">
    <svg viewBox="0 0 260 220">
      <g id="flameGroup" class="flame">
        <path d="M130 40 C 122 55, 118 65, 130 78 C 142 65, 138 55, 130 40 Z" fill="#ffb347"/>
        <path d="M130 52 C 126 60, 124 65, 130 72 C 136 65, 134 60, 130 52 Z" fill="#fff4c2"/>
      </g>
      <g id="smokeGroup" class="smoke">
        <path d="M130 40 Q 120 20, 132 5" fill="none" stroke="#c9c2ba" stroke-width="4" stroke-linecap="round"/>
      </g>
      <rect x="123" y="78" width="14" height="34" rx="3" fill="#ffe2a6" stroke="#e8b86a"/>
      <rect x="60" y="112" width="140" height="40" rx="10" fill="#ffd7c2"/>
      <rect x="60" y="112" width="140" height="10" rx="5" fill="#fff3e6"/>
      <rect x="40" y="152" width="180" height="50" rx="12" fill="var(--coral)"/>
      <rect x="40" y="152" width="180" height="12" rx="6" fill="#ffb997"/>
      <circle cx="80" cy="175" r="5" fill="#fff3e6"/>
      <circle cx="130" cy="180" r="5" fill="#fff3e6"/>
      <circle cx="180" cy="175" r="5" fill="#fff3e6"/>
    </svg>
  </div>
  <div class="sub-text">the candle glows softly, then gently fades on its own...</div>
  <div class="candle-title" id="candleTitle">Happy Birthday</div>
</section>

<!-- ============ STAGE 2: HUGGING SISTERS (auto) ============ -->
<section class="scene" id="hugStage">
  <div class="prompt-text">Two hearts, one bond</div>
  <div class="hug-stage">
    <svg viewBox="0 0 320 320">
      <g class="hug-group">
        <g class="figure-a">
          <ellipse cx="128" cy="230" rx="34" ry="58" fill="var(--figure-a)"/>
          <circle cx="128" cy="150" r="26" fill="var(--figure-a)"/>
          <path d="M104 138 Q128 108 152 138 Q150 118 128 114 Q106 118 104 138 Z" fill="#5a352a"/>
          <path class="arm-wrap" d="M150 195 Q195 200 205 240" fill="none" stroke="var(--figure-a)" stroke-width="16" stroke-linecap="round"/>
        </g>
        <g class="figure-b">
          <ellipse cx="192" cy="230" rx="34" ry="58" fill="var(--figure-b)"/>
          <circle cx="192" cy="150" r="26" fill="var(--figure-b)"/>
          <path d="M168 138 Q192 104 216 138 Q214 116 192 112 Q170 116 168 138 Z" fill="#3f2530"/>
          <path class="arm-wrap" d="M170 195 Q125 200 115 240" fill="none" stroke="var(--figure-b)" stroke-width="16" stroke-linecap="round"/>
        </g>
      </g>
      <g class="rising-heart" transform="translate(160,175)">
        <g class="beat">
          <path d="M0,26 C-26,4 -40,-16 -22,-34 C-8,-46 6,-38 0,-24 C-6,-38 8,-46 22,-34 C40,-16 26,4 0,26 Z" fill="url(#heartGrad)" stroke="#fff" stroke-width="1.5"/>
        </g>
      </g>
      <defs>
        <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff7d7d"/>
          <stop offset="100%" stop-color="#f6c453"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
</section>

<!-- ============ STAGE 3: HUGGING VIDEO (auto) ============ -->
<section class="scene" id="videoStage">
  <div class="prompt-text">A moment we'll never forget</div>
  <div class="video-frame">
    <video id="hugVideo" autoplay muted playsinline>
      <source src="hi4.mp4" type="video/mp4">
    </video>
  </div>
</section>

<!-- ============ STAGE 4: SEED -> FLOWER (auto) ============ -->
<section class="scene" id="flowerStage">
  <div class="prompt-text">Something beautiful is growing</div>
  <div class="flower-wrap">
    <svg viewBox="0 0 220 340">
      <ellipse cx="110" cy="320" rx="70" ry="10" fill="#e8b86a" opacity="0.4"/>
      <path class="stem-path" d="M110 310 C 108 250, 112 180, 110 130" />
      <path class="leaf l1" d="M110 240 Q 70 230, 60 200 Q 100 200, 110 240 Z" fill="var(--leaf)"/>
      <path class="leaf l2" d="M110 200 Q 150 190, 160 160 Q 120 162, 110 200 Z" fill="var(--leaf)"/>
      <g class="petal-group" transform="translate(0,60)">
        <g transform="translate(110,70)">
          <ellipse cx="0" cy="-34" rx="20" ry="30" fill="var(--coral)"/>
          <ellipse cx="0" cy="34" rx="20" ry="30" fill="var(--coral)"/>
          <ellipse cx="-34" cy="0" rx="30" ry="20" fill="var(--peach)"/>
          <ellipse cx="34" cy="0" rx="30" ry="20" fill="var(--peach)"/>
          <ellipse cx="-24" cy="-24" rx="22" ry="16" fill="var(--blush)" transform="rotate(-45 -24 -24)"/>
          <ellipse cx="24" cy="-24" rx="22" ry="16" fill="var(--blush)" transform="rotate(45 24 -24)"/>
          <ellipse cx="-24" cy="24" rx="22" ry="16" fill="var(--blush)" transform="rotate(45 -24 24)"/>
          <ellipse cx="24" cy="24" rx="22" ry="16" fill="var(--blush)" transform="rotate(-45 24 24)"/>
          <clipPath id="flowerPhotoClip">
            <circle cx="0" cy="0" r="42"/>
          </clipPath>
          <circle cx="0" cy="0" r="44" fill="white" stroke="#FFD700" stroke-width="3"/>
          <image href="hi2.jpeg"
                 x="-42" y="-42" width="84" height="84"
                 clip-path="url(#flowerPhotoClip)"
                 preserveAspectRatio="xMidYMid slice"/>
        </g>
      </g>
    </svg>
  </div>
  <div class="sub-text">and there she is</div>
</section>

<!-- ============ STAGE 5: PHOTO STAYS + WISHES OVERLAID (auto) ============ -->
<section class="scene" id="photoStage">
  <div class="photo-frame">
    <img src="hi.jpeg" alt="Birthday girl">
    <div class="photo-gradient"></div>
  </div>
  <div class="photo-content">
    <div class="eyebrow">A little note, just for you</div>
    <h1 class="card-title">Happy Birthday</h1>
    <div class="divider"></div>
    <div class="wish-text" id="wishText"></div>
    <div class="signature-row" id="sigRow">
      <span class="heart-beat">❤</span><span class="name">Your Loving sister</span><span class="heart-beat">❤</span>
    </div>
  </div>
</section>

<audio id="bdaySong" src="hi3.mp3" preload="auto"></audio>

<script>
  const order = ['cake','hug','video','flower','photo'];
  const scenes = {
    cake: document.getElementById('cakeStage'),
    hug: document.getElementById('hugStage'),
    video: document.getElementById('videoStage'),
    flower: document.getElementById('flowerStage'),
    photo: document.getElementById('photoStage')
  };

  function goTo(sceneKey){
    const current = document.querySelector('.scene.active');
    const next = scenes[sceneKey];
    if (current === next) return;
    if (current){
      current.classList.add('exit');
      setTimeout(() => current.classList.remove('active','exit'), 700);
    }
    setTimeout(() => {
      next.classList.add('active');
      if (sceneKey === 'photo'){
        typeWish(true);
        // song now starts at the candle blow-out (see extinguishCandle below),
        // so we no longer (re)start it here.
      }
    }, current ? 400 : 0);
  }

  /* ---------- STAGE 1: candle auto-extinguishes ---------- */
  const flameGroup = document.getElementById('flameGroup');
  const smokeGroup = document.getElementById('smokeGroup');
  const bdaySong = document.getElementById('bdaySong');

  const candleTitle = document.getElementById('candleTitle');
  function extinguishCandle(){
    flameGroup.classList.add('out');
    smokeGroup.classList.add('show');

    // song starts the moment the candle is blown out
    bdaySong.currentTime = 0;
    bdaySong.play().catch(()=>{ /* if autoplay is blocked, it will still be ready to play */ });

    // "Happy Birthday" glows in right as the candle goes dark
    setTimeout(() => candleTitle.classList.add('reveal'), 500);
    // hold on the title for a moment before moving into the hug
    setTimeout(() => goTo('hug'), 500 + 1000 + 1800);
  }
  setTimeout(extinguishCandle, 3000);

  /* ---------- STAGE 2: hug -> auto continue ---------- */
  const HUG_START = 3000 + (500 + 1000 + 1800); // matches goTo('hug') above
  setTimeout(() => goTo('video'), HUG_START + 5600); // after hug sequence settles (~5.6s)

  /* ---------- STAGE 3: video -> auto continue on end or timeout ---------- */
  const hugVideo = document.getElementById('hugVideo');
  let videoAdvanced = false;
  function advanceFromVideo(){
    if (videoAdvanced) return;
    videoAdvanced = true;
    goTo('flower');
  }
  hugVideo.addEventListener('ended', advanceFromVideo);
  hugVideo.addEventListener('error', () => setTimeout(advanceFromVideo, 4000));
  setTimeout(advanceFromVideo, 9000); // fallback if video is short/unavailable

  /* ---------- STAGE 4: flower -> auto continue only after the bloom fully finishes ---------- */
  const FLOWER_BLOOM_COMPLETE = 3300;
  const FLOWER_HOLD_AFTER_BLOOM = 2400;
  let flowerTimerSet = false;
  const flowerObserver = new MutationObserver(() => {
    if (scenes.flower.classList.contains('active') && !flowerTimerSet){
      flowerTimerSet = true;
      setTimeout(() => goTo('photo'), FLOWER_BLOOM_COMPLETE + FLOWER_HOLD_AFTER_BLOOM);
    }
  });
  flowerObserver.observe(scenes.flower, { attributes:true, attributeFilter:['class'] });

  /* ---------- STAGE 5: wishes typewriter ---------- */
  const wishLines = [
    "From scraped knees to grown-up dreams, you've been my constant —",
    "the one person who has known every version of me and loved them all.",
    "Today isn't just your birthday, it's a celebration of everything you are:",
    "brave, gentle, brilliant, and endlessly kind.",
    "Here's to more inside jokes, late-night calls, and years by your side.",
    "I love you, sis. Happy Birthday. 🎂💛"
  ];
  const container = document.getElementById('wishText');
  const sigRow = document.getElementById('sigRow');
  let typingActive = false;
  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  async function typeWish(triggerCelebration){
    if (typingActive) return;
    typingActive = true;
    container.innerHTML = '';
    sigRow.style.animation = 'none'; sigRow.style.opacity = 0;

    for (let li = 0; li < wishLines.length; li++){
      const lineDiv = document.createElement('div');
      container.appendChild(lineDiv);
      const line = wishLines[li];
      let built = '';
      for (let ci = 0; ci < line.length; ci++){
        built += line[ci];
        lineDiv.innerHTML = built + '<span class="cursor">&nbsp;</span>';
        await sleep(20 + Math.random()*16);
      }
      lineDiv.innerHTML = built;
      await sleep(240);
    }
    void sigRow.offsetWidth;
    sigRow.style.animation = 'fadeUp 1s ease forwards';
    typingActive = false;
    if (triggerCelebration) celebrate();
  }

  const styleTag = document.createElement('style');
  styleTag.textContent = `@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}`;
  document.head.appendChild(styleTag);

  /* ---------- celebration: confetti + fireworks (photo stays visible underneath) ---------- */
  function rand(min,max){ return Math.random()*(max-min)+min; }

  function burstConfetti(){
    const layer = document.getElementById('confetti-layer');
    const colors = ['#ff7d7d','#f6c453','#ffb997','#ffd7c2','#fff3e6'];
    for(let i=0;i<90;i++){
      const c = document.createElement('div');
      c.className='confetto';
      const w = rand(6,11);
      c.style.width = w+'px'; c.style.height = (w*rand(1.6,2.4))+'px';
      c.style.left = rand(0,100)+'vw';
      c.style.background = colors[Math.floor(rand(0,colors.length))];
      c.style.animationDuration = rand(2.4,4)+'s';
      c.style.animationDelay = rand(0,0.6)+'s';
      layer.appendChild(c);
      setTimeout(()=> c.remove(), 5200);
    }
  }
  function fireworkBurst(x, y){
    const colors = ['#ff7d7d','#f6c453','#ffb997','#fff3e6'];
    for(let i=0;i<18;i++){
      const f = document.createElement('div');
      f.className = 'firework';
      const size = rand(5,9);
      f.style.width = size+'px'; f.style.height = size+'px';
      f.style.background = colors[Math.floor(rand(0,colors.length))];
      f.style.left = x+'px'; f.style.top = y+'px';
      const angle = Math.random()*Math.PI*2;
      const dist = rand(60,140);
      f.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
      document.body.appendChild(f);
      setTimeout(()=> f.remove(), 1000);
    }
  }
  function celebrate(){
    burstConfetti();
    let count = 0;
    const fwTimer = setInterval(() => {
      fireworkBurst(rand(60, window.innerWidth-60), rand(80, window.innerHeight*0.5));
      count++;
      if (count > 5) clearInterval(fwTimer);
    }, 400);
  }

  /* ---------- ambient warm decoration ---------- */
  function spawnWashes(){
    const colors = ['#ff7d7d','#f6c453','#ffb997','#ffd7c2'];
    for(let i=0;i<8;i++){
      const o = document.createElement('div');
      o.className='wash';
      const size = rand(50,150);
      o.style.width = size+'px'; o.style.height = size+'px';
      o.style.left = rand(0,100)+'vw'; o.style.top = rand(0,100)+'vh';
      o.style.background = `radial-gradient(circle, ${colors[i%colors.length]}44, transparent 70%)`;
      o.style.animationDuration = rand(7,15)+'s';
      document.body.appendChild(o);
    }
  }
  function spawnSparks(){
    for(let i=0;i<20;i++){
      const s = document.createElement('div');
      s.className='spark';
      s.textContent = Math.random() > 0.5 ? '✦' : '✧';
      s.style.left = rand(0,100)+'vw'; s.style.top = rand(0,100)+'vh';
      s.style.fontSize = rand(8,16)+'px';
      s.style.animationDuration = rand(1.8,3.6)+'s';
      s.style.animationDelay = rand(0,3)+'s';
      document.body.appendChild(s);
    }
  }
  spawnWashes();
  spawnSparks();
</script>
</body>
